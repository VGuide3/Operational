# Local development topology.
#
# Services are separated to mirror the three trust boundaries: the web/API tier
# holds no execution keys, and the execution services hold isolated credentials.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      DATABASE_URL: postgres://ops:ops@postgres:5432/ops
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
